<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión de dispositivos — Abyss Blade</title><style>body{margin:0;background:#e7e7eb;font:13px Arial;color:#222}nav{padding:12px 24px;height:65px;box-sizing:border-box;display:flex;gap:10px;align-items:center}button{padding:9px 15px;background:white;border:1px solid #777;cursor:pointer}button.on{background:#222;color:white}.stage{display:flex;justify-content:center;align-items:start;padding:12px;overflow:auto}iframe{border:0;box-shadow:0 10px 35px #0004;background:#1b1e24;flex:none}span{margin-left:auto;font-size:11px}</style></head><body><nav><b>REVISIÓN RESPONSIVE</b><button data-w="1280" data-h="800">Escritorio 1280</button><button data-w="768" data-h="1024">Tablet 768</button><button data-w="390" data-h="844">Móvil 390</button><span>Viewport real del iframe</span></nav><div class="stage"><iframe id="device" title="Prototipo por dispositivo" width="390" height="844" src="index.html"></iframe></div><script>const f=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{f.width=b.dataset.w;f.height=b.dataset.h;document.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});</script></body></html>
